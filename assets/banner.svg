<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081224"/>
      <stop offset="0.55" stop-color="#0D1F3C"/>
      <stop offset="1" stop-color="#0A1830"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1D4ED8"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38BDF8" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>
    <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

    <!-- Left: identity -->
    <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="64" y="86" font-size="15" font-weight="600" letter-spacing="3" fill="#22D3EE">DATA · BUSINESS · INTELLIGENCE</text>
      <text x="62" y="146" font-size="50" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">Omar Ali Abdelhamed</text>
      <rect x="64" y="166" width="72" height="4" rx="2" fill="url(#accent)"/>
      <text x="64" y="206" font-size="20" font-weight="600" fill="#BAE6FD">Business Analyst  |  Data Analyst  |  BI Developer  |  Aspiring Data Engineer</text>
      <text x="64" y="240" font-size="16" font-weight="400" fill="#94A3B8">Turning business data into decisions: dashboards, KPIs and data pipelines</text>

      <!-- chips -->
      <g transform="translate(64,262)">
        <rect width="150" height="30" rx="15" fill="#0F2A4A" stroke="#22D3EE" stroke-opacity="0.45"/>
        <path d="M20 8.5a5 5 0 0 0-5 5c0 3.8 5 8.5 5 8.5s5-4.7 5-8.5a5 5 0 0 0-5-5zm0 6.8a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6z" fill="#22D3EE"/>
        <text x="34" y="20" font-size="13.5" font-weight="500" fill="#E2E8F0">Giza, Egypt</text>
        <g transform="translate(162,0)">
          <rect width="236" height="30" rx="15" fill="#0F2A4A" stroke="#22D3EE" stroke-opacity="0.45"/>
          <rect x="14" y="10" width="3" height="11" rx="1" fill="#22D3EE"/>
          <rect x="19" y="7" width="3" height="14" rx="1" fill="#22D3EE"/>
          <rect x="24" y="12" width="3" height="9" rx="1" fill="#22D3EE"/>
          <text x="36" y="20" font-size="13.5" font-weight="500" fill="#E2E8F0">Microfinance Analytics</text>
        </g>
      </g>
    </g>

    <!-- Right: dashboard card -->
    <g transform="translate(860,52)">
      <rect width="356" height="216" rx="14" fill="#0B1A31" stroke="#1E3A5F"/>
      <g font-family="Inter, 'Segoe UI', Arial, sans-serif">
        <circle cx="20" cy="20" r="4" fill="#22D3EE"/>
        <text x="32" y="25" font-size="12" font-weight="600" fill="#CBD5E1">Portfolio KPIs</text>
        <!-- KPI tiles -->
        <g transform="translate(16,40)">
          <rect width="100" height="44" rx="8" fill="#10284A"/>
          <text x="10" y="18" font-size="9.5" fill="#94A3B8">Branches</text>
          <text x="10" y="36" font-size="16" font-weight="700" fill="#F8FAFC">224</text>
        </g>
        <g transform="translate(128,40)">
          <rect width="100" height="44" rx="8" fill="#10284A"/>
          <text x="10" y="18" font-size="9.5" fill="#94A3B8">Portfolio</text>
          <text x="10" y="36" font-size="16" font-weight="700" fill="#F8FAFC">EGP 4B+</text>
        </g>
        <g transform="translate(240,40)">
          <rect width="100" height="44" rx="8" fill="#10284A"/>
          <text x="10" y="18" font-size="9.5" fill="#94A3B8">Customers</text>
          <text x="10" y="36" font-size="16" font-weight="700" fill="#F8FAFC">142K+</text>
        </g>
      </g>
      <!-- bars -->
      <g transform="translate(16,100)">
        <line x1="0" y1="100" x2="150" y2="100" stroke="#1E3A5F"/>
        <rect x="6" y="62" width="16" height="38" rx="3" fill="url(#bar)"/>
        <rect x="30" y="44" width="16" height="56" rx="3" fill="url(#bar)"/>
        <rect x="54" y="52" width="16" height="48" rx="3" fill="url(#bar)"/>
        <rect x="78" y="30" width="16" height="70" rx="3" fill="url(#bar)"/>
        <rect x="102" y="38" width="16" height="62" rx="3" fill="url(#bar)"/>
        <rect x="126" y="16" width="16" height="84" rx="3" fill="url(#bar)"/>
      </g>
      <!-- line -->
      <g transform="translate(186,100)">
        <line x1="0" y1="100" x2="154" y2="100" stroke="#1E3A5F"/>
        <path d="M0 80 L26 70 L52 74 L78 48 L104 54 L130 28 L154 18 L154 100 L0 100 Z" fill="url(#area)"/>
        <path d="M0 80 L26 70 L52 74 L78 48 L104 54 L130 28 L154 18" fill="none" stroke="#22D3EE" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="154" cy="18" r="4" fill="#0B1A31" stroke="#22D3EE" stroke-width="2"/>
      </g>
    </g>

  </g>
</svg>
